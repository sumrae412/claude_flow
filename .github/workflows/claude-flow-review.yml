# Advisory (not a required status check). This workflow posts AI PR review
# comments but is not wired into branch protection. Merges are not blocked
# on its outcome. If we ever want it blocking, add it to the repo's
# required_status_checks list AND backfill review on any PRs merged during
# a broken window. Historically this check silently failed between
# 05aedde (workflow added) and e087f26 (lockfile generated) — intentionally
# not blocking merges, so no retroactive review needed.
name: Claude Flow PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip bot PRs and draft PRs
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: agent-sdk/pr-reviewer
        run: npm ci

      - name: Build
        working-directory: agent-sdk/pr-reviewer
        run: npm run build

      - name: Run PR review
        working-directory: agent-sdk/pr-reviewer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node dist/index.js
